<!-- =====================================================================
     Custom <head> additions for AI for Faculty.
     Minimal Mistakes loads this file at the end of every page's <head>,
     so anything here (fonts, favicons, meta tags) applies site-wide.
     ===================================================================== -->

<!-- Fonts: Source Serif 4 (reading serif) + Inter (headings).
     These are matched to the font names in assets/css/main.scss —
     if you swap a font in one place, swap it in the other. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">

<!-- Favicon (optional — add whenever you like):
       1. Put an icon file in /assets/images/  (e.g. favicon.png)
       2. Uncomment the line below and adjust the filename.
<link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
-->
