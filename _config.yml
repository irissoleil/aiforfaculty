# ------------------------------------------------------------
# Site settings
# ------------------------------------------------------------
title: "AI for Faculty"
subtitle: "Ethical, Equitable, and Courageous Teaching in the Age of AI"
description: >-
  An open, volunteer commons for postsecondary educators exploring how to
  teach AI critically, design human-centered pedagogy, and engage students
  without outsourcing judgment to algorithms.
url: "https://www.aiforfaculty.com"
baseurl: ""
locale: "en-US"

# ------------------------------------------------------------
# Theme (pulled in remotely — GitHub Pages builds it for you,
# no vendored theme files to maintain)
# ------------------------------------------------------------
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

# ------------------------------------------------------------
# Build settings
# ------------------------------------------------------------
markdown: kramdown
highlighter: rouge
paginate: 10
paginate_path: /page:num/

# Client-side search (lunr) — adds a search icon to the top bar.
# No external service; the index is built at publish time. Handy as
# your archive of field reports grows.
search: true
search_full_content: true

include:
  - _pages

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

# ------------------------------------------------------------
# Archives — one page listing by category (Field Report / Essay),
# one listing by tag (theme, e.g. assessment, policy, tools)
# ------------------------------------------------------------
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# ------------------------------------------------------------
# Defaults applied to every post
# ------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      toc: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false

# ------------------------------------------------------------
# Author / sidebar profile
# ------------------------------------------------------------
author:
  name: "AI for Faculty"
  # Prefer your own byline on posts? Change the line above to "Iris S. De Lis".
  # avatar: "/assets/images/bio-photo.jpg"   # add the image first, then uncomment
  bio: "Slower thinking about AI and higher ed — field reports and essays on teaching, assessment, and academic judgment."
  # location: "United States"                 # optional
  links:
    # Uncomment the ones you use and fill in the real URLs; delete the rest.
    # - label: "Email"
    #   icon: "fas fa-fw fa-envelope"
    #   url: "mailto:you@example.com"
    # - label: "Mastodon"
    #   icon: "fab fa-fw fa-mastodon"
    #   url: "https://your.instance/@you"
    # - label: "RSS"
    #   icon: "fas fa-fw fa-rss-square"
    #   url: "/feed.xml"

footer:
  links: []

# ------------------------------------------------------------
# Navigation
# ------------------------------------------------------------
# The masthead (top nav bar) is defined in _data/navigation.yml,
# under the "main" key — that's where Minimal Mistakes looks for
# it. Edit that file to change the header links. (A "main:" block
# placed here in _config.yml is ignored by the theme.)
